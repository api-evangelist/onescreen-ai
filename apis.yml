apis:
- name: OneScreen MCP Server
  description: >-
    OneScreen's only API surface: a remote Model Context Protocol server over Streamable
    HTTP that exposes OOH audience personas, market and inventory rankings, geospatial
    points of interest, media-owner records and the plan/RFP/messaging marketplace workflow
    to any MCP-capable AI client. POST-only (GET returns 405); every call requires an
    OAuth 2.1 bearer token and the 401 advertises RFC 9728 protected-resource metadata, so
    a client can discover and register itself with no out-of-band configuration. The tool
    manifest (15 tools per the provider) is auth-gated.
  humanURL: https://www.onescreen.ai/mcp/
  baseURL: https://mcp.onescreen.ai/mcp
