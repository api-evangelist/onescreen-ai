name: OneScreen AI
description: >-
  OneScreen AI is a data-driven out-of-home (OOH) advertising company that makes
  real-world media — billboards, transit, and place-based advertising — as
  queryable and buyable as any digital channel. It combines more than 1,500 OOH
  audience personas, close to one million live inventory listings, and
  audience-based market and inventory recommendation models. OneScreen exposes
  this OOH intelligence to AI agents through a public Model Context Protocol
  (MCP) server at https://mcp.onescreen.ai/mcp, protected by OAuth 2.1 with
  audience-restricted tokens, open dynamic client registration and a published
  22-scope permission model — and no REST or GraphQL contract at all. Products
  include OneScreen Research (free public beta) and OneScreen Planner (closed
  beta). The company was originally surfaced as a Techstars portfolio lead and
  is headquartered in Boston, Massachusetts.
